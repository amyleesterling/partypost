<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="55%" stop-color="#B3E0FF"/>
      <stop offset="78%" stop-color="#FFE9B3"/>
      <stop offset="100%" stop-color="#F4D896"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="60%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#FFC857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <g transform="translate(990, 130)">
    <circle r="135" fill="url(#sun)" opacity="0.85"/>
    <circle r="62" fill="#FFE066"/>
    <circle r="62" fill="#FFC857" opacity="0.4"/>
  </g>

  <!-- soft clouds -->
  <g opacity="0.7">
    <ellipse cx="240" cy="120" rx="160" ry="34" fill="url(#cloud)"/>
    <ellipse cx="640" cy="80"  rx="120" ry="22" fill="url(#cloud)"/>
    <ellipse cx="430" cy="170" rx="100" ry="22" fill="url(#cloud)"/>
  </g>

  <!-- water band -->
  <rect x="0" y="380" width="1200" height="60" fill="#5BB6E5" opacity="0.55"/>
  <path d="M0 380 Q 60 372 120 380 T 240 380 T 360 380 T 480 380 T 600 380 T 720 380 T 840 380 T 960 380 T 1080 380 T 1200 380 V 392 H 0 Z" fill="#FFFFFF" opacity="0.55"/>

  <!-- sand -->
  <rect x="0" y="440" width="1200" height="160" fill="#F4D896"/>

  <!-- bunting -->
  <g transform="translate(0, 0)">
    <path d="M0 30 Q 200 80 400 30 T 800 30 T 1200 30" stroke="#3B2A6B" stroke-width="3" fill="none" opacity="0.6"/>
    <g font-family="Georgia, serif">
      <polygon points="80,28 120,28 100,68" fill="#FF7AB6"/>
      <polygon points="180,32 220,32 200,72" fill="#FFD166"/>
      <polygon points="280,30 320,30 300,70" fill="#7DCFB6"/>
      <polygon points="880,30 920,30 900,70" fill="#9C7DDB"/>
      <polygon points="980,28 1020,28 1000,68" fill="#FF7AB6"/>
      <polygon points="1080,32 1120,32 1100,72" fill="#FFD166"/>
    </g>
  </g>

  <!-- sandcastle -->
  <g transform="translate(140, 410)">
    <rect x="0" y="40" width="120" height="60" fill="#E0B96E"/>
    <rect x="0" y="40" width="120" height="6" fill="#C99F58"/>
    <rect x="0" y="40" width="20" height="60" fill="#C99F58" opacity="0.4"/>
    <rect x="50" y="20" width="20" height="20" fill="#E0B96E"/>
    <polygon points="55,20 65,5 75,20" fill="#FF7AB6"/>
    <rect x="-10" y="30" width="20" height="40" fill="#E0B96E"/>
    <rect x="110" y="30" width="20" height="40" fill="#E0B96E"/>
    <polygon points="-10,30 0,15 10,30" fill="#FFD166"/>
    <polygon points="110,30 120,15 130,30" fill="#7DCFB6"/>
  </g>

  <!-- beach ball -->
  <g transform="translate(360, 478)">
    <circle r="32" fill="#ffffff"/>
    <path d="M-32 0 A 32 32 0 0 1 32 0 Z" fill="#FF7AB6"/>
    <path d="M-32 0 A 32 32 0 0 0 -10 -30 L 10 30 A 32 32 0 0 0 32 0 Z" fill="#7DCFB6" opacity="0.85"/>
    <circle r="32" fill="none" stroke="#3B2A6B" stroke-width="2" opacity="0.2"/>
  </g>

  <!-- starfish -->
  <g transform="translate(960, 510) rotate(20)">
    <path d="M0 -22 L 7 -7 L 22 -5 L 11 5 L 14 22 L 0 13 L -14 22 L -11 5 L -22 -5 L -7 -7 Z" fill="#FF7AB6"/>
  </g>

  <!-- title -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="600" y="220" font-size="38" fill="#FF7AB6" font-style="italic" font-weight="600">You&#039;re Invited to</text>
    <text x="600" y="320" font-size="92" fill="#3B2A6B" font-weight="800">Lily&#039;s 6th</text>
    <text x="600" y="380" font-size="58" fill="#2F80ED" font-weight="700" letter-spacing="1">Birthday Party!</text>
  </g>

  <!-- subtle frame -->
  <rect x="6" y="6" width="1188" height="588" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.5"/>
</svg>
