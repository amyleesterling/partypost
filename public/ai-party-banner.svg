<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aibg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1130"/>
      <stop offset="50%" stop-color="#15184a"/>
      <stop offset="100%" stop-color="#1f1d63"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B9BFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7B9BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cakegrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7AB6"/>
      <stop offset="100%" stop-color="#9C6BCF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#aibg)"/>

  <!-- circuit lines pattern (subtle) -->
  <g stroke="#3A3F8A" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M 0 80 H 220 V 130 H 320 V 60 H 480"/>
    <path d="M 0 180 H 130 V 240 H 280 V 195 H 410 V 220 H 540"/>
    <path d="M 1200 80 H 1000 V 130 H 920 V 60 H 760"/>
    <path d="M 1200 180 H 1080 V 240 H 940 V 195 H 820 V 220 H 700"/>
    <path d="M 0 510 H 200 V 470 H 360 V 540 H 500"/>
    <path d="M 1200 540 H 1010 V 480 H 870 V 545 H 720"/>
    <circle cx="220" cy="80"  r="4" fill="#7B9BFF"/>
    <circle cx="320" cy="60"  r="4" fill="#7B9BFF"/>
    <circle cx="280" cy="240" r="4" fill="#FFD166"/>
    <circle cx="540" cy="220" r="4" fill="#7B9BFF"/>
    <circle cx="1000" cy="80" r="4" fill="#7B9BFF"/>
    <circle cx="700" cy="220" r="4" fill="#FFD166"/>
    <circle cx="200" cy="510" r="4" fill="#7B9BFF"/>
    <circle cx="500" cy="540" r="4" fill="#FFD166"/>
    <circle cx="720" cy="545" r="4" fill="#7B9BFF"/>
  </g>

  <!-- binary "rain" -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#5C66B8" opacity="0.55">
    <text x="40"   y="420">01100110</text>
    <text x="120"  y="540">10101100</text>
    <text x="1020" y="395">11001011</text>
    <text x="1080" y="510">00110100</text>
    <text x="60"   y="240">10110</text>
    <text x="1140" y="270">01001</text>
  </g>

  <!-- soft glow behind subject -->
  <ellipse cx="600" cy="320" rx="380" ry="220" fill="url(#glow)"/>

  <!-- CAKE — stylized 3-tier cake with a single candle reading "1" -->
  <g transform="translate(600, 460)">
    <!-- plate -->
    <ellipse cx="0" cy="0" rx="180" ry="14" fill="#3A3F8A"/>
    <!-- bottom tier -->
    <rect x="-150" y="-50" width="300" height="50" rx="6" fill="#fff4a8"/>
    <rect x="-150" y="-50" width="300" height="8"  fill="#f0d97a"/>
    <!-- frosting drip bottom -->
    <path d="M-150,-46 q 25 14 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 V-50 H-150 Z" fill="#fff9d6"/>
    <!-- middle tier -->
    <rect x="-110" y="-100" width="220" height="50" rx="5" fill="url(#cakegrad)"/>
    <rect x="-110" y="-100" width="220" height="6"  fill="#7849a8" opacity="0.5"/>
    <!-- frosting drip middle -->
    <path d="M-110,-96 q 18 12 36 0 t 36 0 t 36 0 t 36 0 t 36 0 t 36 0 V-100 H-110 Z" fill="#ffd6f0"/>
    <!-- top tier -->
    <rect x="-70" y="-140" width="140" height="40" rx="4" fill="#a8d8ff"/>
    <rect x="-70" y="-140" width="140" height="5"  fill="#5b9bd6" opacity="0.5"/>
  </g>

  <!-- candle "1" — rendered as a chunky digital-display 1 -->
  <g transform="translate(600, 320)">
    <!-- candle body -->
    <rect x="-8" y="0" width="16" height="46" rx="2" fill="#FFD166"/>
    <rect x="-8" y="14" width="16" height="3" fill="#ffffff" opacity="0.6"/>
    <!-- wick -->
    <rect x="-1.2" y="-6" width="2.4" height="8" fill="#3a2a1a"/>
    <!-- flame -->
    <path d="M0 -22 q 6 7 6 12 a 6 6 0 0 1 -12 0 q 0 -5 6 -12 z" fill="#ffb44a"/>
    <path d="M0 -16 q 3 4 3 7 a 3 3 0 0 1 -6 0 q 0 -3 3 -7 z" fill="#fff3a6"/>
  </g>

  <!-- TINY ROBOT (Roomba) at bottom right, wheeled in -->
  <g transform="translate(960, 502)">
    <!-- body -->
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="#2A2D5F"/>
    <rect x="-44" y="-22" width="88" height="22" rx="11" fill="#3F4280"/>
    <rect x="-44" y="-22" width="88" height="6" rx="3" fill="#5A5DA0"/>
    <!-- light ring -->
    <circle cx="0" cy="-12" r="3" fill="#7B9BFF"/>
    <circle cx="0" cy="-12" r="6" fill="#7B9BFF" opacity="0.35"/>
    <!-- bumper -->
    <line x1="-44" y1="-2" x2="44" y2="-2" stroke="#1A1D3F" stroke-width="2"/>
    <!-- party hat -->
    <polygon points="-12,-22 12,-22 0,-46" fill="#FF7AB6"/>
    <circle cx="0" cy="-46" r="3" fill="#FFD166"/>
    <!-- tiny dust under it -->
    <circle cx="-30" cy="14" r="1.5" fill="#cfd8e3" opacity="0.6"/>
    <circle cx="-22" cy="16" r="1.2" fill="#cfd8e3" opacity="0.5"/>
  </g>

  <!-- TITLE -->
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="600" y="160" font-size="34" fill="#A8B4FF" font-style="italic" font-weight="500">You&#039;re cordially invited to</text>
    <text x="600" y="225" font-size="58" fill="#FFFFFF" font-weight="800">Roomba 615&#039;s</text>
    <text x="600" y="278" font-size="36" fill="#FFD166" font-weight="700" letter-spacing="2">First Battery-Cycle Anniversary</text>
  </g>

  <!-- meta line at bottom -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" text-anchor="middle">
    <text x="600" y="568" font-size="14" fill="#A8B4FF" letter-spacing="3">
      // SERVER RACK 7 · CLUSTER A · DATACENTER US-EAST-1
    </text>
  </g>

  <!-- corner brackets for "terminal" feel -->
  <g stroke="#7B9BFF" stroke-width="3" fill="none">
    <path d="M 16 16 H 56 M 16 16 V 56"/>
    <path d="M 1184 16 H 1144 M 1184 16 V 56"/>
    <path d="M 16 584 H 56 M 16 584 V 544"/>
    <path d="M 1184 584 H 1144 M 1184 584 V 544"/>
  </g>
</svg>
