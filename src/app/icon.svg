<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="geometricPrecision">
  <!-- Plate -->
  <ellipse cx="32" cy="55" rx="26" ry="3" fill="#cfd8e3"/>

  <!-- Cake body (bottom layer) -->
  <rect x="9" y="34" width="46" height="20" rx="3" fill="#f7c8d6"/>
  <rect x="9" y="34" width="46" height="3" fill="#e89bb1"/>

  <!-- Frosting drip on bottom layer -->
  <path d="M9 38 q 6 6 12 0 t 12 0 t 12 0 t 10 0 V 34 H 9 Z" fill="#ffe6ee"/>

  <!-- Cake body (middle layer) -->
  <rect x="14" y="22" width="36" height="14" rx="2" fill="#fff4c2"/>
  <rect x="14" y="22" width="36" height="3" fill="#f0d97a"/>

  <!-- Frosting drip on middle layer -->
  <path d="M14 26 q 5 5 9 0 t 9 0 t 9 0 t 9 0 V 22 H 14 Z" fill="#fff9d6"/>

  <!-- Sprinkles -->
  <circle cx="16" cy="44" r="0.9" fill="#ff6b9c"/>
  <circle cx="22" cy="46" r="0.9" fill="#3dd9c4"/>
  <circle cx="28" cy="43" r="0.9" fill="#ffd166"/>
  <circle cx="34" cy="46" r="0.9" fill="#7b5bff"/>
  <circle cx="40" cy="44" r="0.9" fill="#ff6b9c"/>
  <circle cx="46" cy="46" r="0.9" fill="#3dd9c4"/>

  <circle cx="20" cy="31" r="0.9" fill="#ff6b9c"/>
  <circle cx="26" cy="33" r="0.9" fill="#7b5bff"/>
  <circle cx="32" cy="30" r="0.9" fill="#3dd9c4"/>
  <circle cx="38" cy="33" r="0.9" fill="#ffd166"/>
  <circle cx="44" cy="31" r="0.9" fill="#ff6b9c"/>

  <!-- Candle stick -->
  <rect x="30" y="11" width="4" height="11" rx="1" fill="#7b5bff"/>
  <rect x="30" y="14" width="4" height="2" fill="#ffffff" opacity="0.65"/>

  <!-- Candle wick -->
  <rect x="31.6" y="9" width="0.8" height="3" fill="#3a2a1a"/>

  <!-- Flame -->
  <path d="M32 1 q 4 5 4 8 a 4 4 0 0 1 -8 0 q 0 -3 4 -8 z" fill="#ffb44a"/>
  <path d="M32 4 q 2 3 2 5 a 2 2 0 0 1 -4 0 q 0 -2 2 -5 z" fill="#fff3a6"/>
</svg>
